[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccc-arena-results"
version = "0.0.0"
description = "Acompanhamento da Temporada da Arena dos Cavaleiros"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ccc-arena = "ccc_arena_results.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ccc_arena_results"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
